# ===============================
# PRODUCTION CONFIGURATION
# ===============================

server.port=6060

# 1. MongoDB Configuration (Production)
spring.data.mongodb.uri=${MONGODB_URI}

# 2. Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

# 3. Python RAG Service (Production)
rag.service.url=${RAG_SERVICE_URL}

# Logging
logging.level.root=INFO
logging.level.com.aeo.analyzer=INFO

# Security Configuration (Test)
spring.security.user.name=${APP_USERNAME}
spring.security.user.password=${APP_PASSWORD}

# Security Measures
management.endpoints.web.exposure.include=health
spring.devtools.add-properties=false