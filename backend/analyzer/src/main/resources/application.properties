server.port=6060
spring.application.name=aeo-content-analyzer

# MongoDB - Individual properties (NOT URI)
spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST:localhost}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT:27017}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:aeo_analyzer}
spring.data.mongodb.username=${SPRING_DATA_MONGODB_USERNAME:admin}
spring.data.mongodb.password=${SPRING_DATA_MONGODB_PASSWORD:admin123}
spring.data.mongodb.authentication-database=${SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE:admin}

# Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
openrouter.api.key=${OPENROUTER_API_KEY}

# RAG Service
rag.service.url=http://localhost:8090

# Security
spring.security.user.name=${APP_USERNAME:admin}
spring.security.user.password=${APP_PASSWORD:admin123}

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.aeo.analyzer=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
