server.port=6060
spring.application.name=aeo-content-analyzer

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# API Keys
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
openrouter.api.key=${OPENROUTER_API_KEY}

# External Services
rag.service.url=http://localhost:8090


# Security
spring.security.user.name=${APP_USERNAME:admin}
spring.security.user.password=${APP_PASSWORD:admin123}

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.aeo.analyzer=DEBUG


# Actuator - Monitoring Endpoints
# Expose health, info, prometheus, and metrics endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Health endpoint configuration
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Enable Prometheus endpoint
management.endpoint.prometheus.enabled=true
app.frontend.url=${FRONTEND_URL:http://localhost:2000}

# Metrics Configuration
# Add custom tags to all metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=demo

# Enable JVM metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# Enable HTTP metrics
management.metrics.enable.http=true

# Histogram percentiles for HTTP requests
management.metrics.distribution.percentiles-histogram.http.server.requests=true
