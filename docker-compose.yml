version: "3.8"

services:
  backend:
    build:
      context: ./backend/analyzer
      dockerfile: Dockerfile
    container_name: aeo-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin123}

      SERVER_PORT: 6060
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "6060:6060"
    networks:
      - aeo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aeo-frontend
    restart: unless-stopped
    ports:
      - "2000:80"
    depends_on:
      - backend
    networks:
      - aeo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  aeo-network:
    driver: bridge
