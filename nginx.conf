events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Main Website
    server {
        listen 80;
        server_name aeo-analyzer.works www.aeo-analyzer.works;

        location /api/ {
            proxy_pass http://backend:6060;  # ← Use service name
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # Grafana
    server {
        listen 80;
        server_name grafana.aeo-analyzer.works;

        location / {
            proxy_pass http://grafana:3000;  # ← Use service name NOT container name
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Prometheus
    server {
        listen 80;
        server_name prometheus.aeo-analyzer.works;

        location / {
            proxy_pass http://prometheus:9090;  # ← Use service name
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
     
