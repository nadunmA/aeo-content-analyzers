# 1. Main Website & API
server {
    listen 80;
    server_name aeo-analyzer.works;

    location /api/ {
        proxy_pass http://backend:6060;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /health { return 200 "healthy\n"; }
}

# 2. Grafana Sub-domain
server {
    listen 80;
    server_name grafana.aeo-analyzer.works;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}

# 3. Prometheus Sub-domain
server {
    listen 80;
    server_name prometheus.aeo-analyzer.works;

    location / {
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
